# ============================================================================ #
#                                Build Workflow                                #
# ============================================================================ #
# Builds the sdist and wheel, validates the metadata and installs the wheel    #
# into a clean virtual environment. Catches packaging mistakes (a missing      #
# license file, glyph-set data left out of the wheel) before a release does.   #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]    - skips all workflows                                         #
#   [build-skip] - skips this workflow only                                    #
# ============================================================================ #

name: "CI: Build"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE.md"
      - ".github/workflows/ci-build.yaml"
  pull_request:
    branches: ["dev", "release"]

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  # Check if the commit message / PR title contains skip tags
  check:
    name: "Skip Check"
    runs-on: "ubuntu-latest"
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Run: Check skip tags"
        id: "belay"
        uses: OctalMesh/belay-action@v1
        with:
          signal_tags: "[ci-skip],[build-skip]"

  # Build and inspect the distribution
  build:
    name: "Package"
    needs: "check"
    if: needs.check.outputs.should_skip != 'true'
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: "Setup: Install build tools"
        run: "pip install build twine"

      - name: "Run: Build sdist and wheel"
        run: "python -m build"

      - name: "Run: Validate metadata"
        run: "twine check --strict dist/*"

      - name: "Run: Smoke test the wheel"
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/octalfont --version
          /tmp/smoke/bin/octalfont release --help >/dev/null
          /tmp/smoke/bin/python - <<'PY'
          from importlib.resources import files
          data = files("octalfont") / "data" / "glyphsets"
          names = sorted(p.name for p in data.iterdir())
          assert "GF_Latin_Core.nam" in names and "GF_Cyrillic_Plus.nam" in names, names
          print("glyph sets shipped:", len(names))
          PY
