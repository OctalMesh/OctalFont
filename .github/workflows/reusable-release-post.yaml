# ============================================================================ #
#                       Reusable: Post-Release Workflow                        #
# ============================================================================ #
# Runs on every push to the release branch, i.e. right after the release PR    #
# is merged. Two independent jobs:                                             #
#  - tag-release: if the version on release has no tag yet, cuts the annotated #
#    tag "vX.Y.Z" on the pushed commit and opens a DRAFT GitHub Release. Its   #
#    notes are the CHANGELOG.md section of that version plus the generated     #
#    list of merged pull requests. Nothing is distributed yet: that happens    #
#    when a maintainer clicks "Publish" on the draft (see the publish workflow #
#    of the repository). Already tagged versions are skipped.                  #
#  - sync-dev: merges release back into dev so the merge commit and the        #
#    version-bump commit never have to be reconciled by hand. The App must be  #
#    allowed to push to dev (bypass list of the branch protection / ruleset).  #
#                                                                              #
# Auth: the octal-automation GitHub App (BOT_CLIENT_ID + BOT_PRIVATE_KEY       #
# via `secrets: inherit`). The sync push to dev therefore triggers the         #
# follow-up workflows, and the release is authored by the bot.                 #
#                                                                              #
# See: RELEASING.md - for more details on the release process.                 #
# ============================================================================ #

name: "Reusable: Post-Release"

on:
  workflow_call:
    inputs:
      kind:
        description: "Repository kind: 'tool' (octalfont itself) or 'font' (a font repository)"
        type: string
        required: true

      title:
        description: "Name shown in the GitHub Release title, e.g. 'OctalFont' -> 'OctalFont v0.1.0'"
        type: string
        required: true

      base-branch:
        type: string
        default: "dev"

      release-branch:
        type: string
        default: "release"

      python-version:
        type: string
        default: "3.12"

permissions:
  contents: "read"

defaults:
  run:
    shell: "bash"

jobs:
  tag-release:
    name: "Tag & Draft Release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    steps:
      - name: "Setup: GitHub App token"
        id: "app"
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app.outputs.token }}

      - name: "Setup: Git identity"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: "Setup: Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: "Setup: Install octalfont"
        env:
          KIND: ${{ inputs.kind }}
        run: |
          if [ "$KIND" = "tool" ]; then
            pip install -e .
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libcairo2-dev pkg-config
            pip install -r requirements.txt
          fi

      - name: "Run: Read version"
        id: "info"
        run: |
          VERSION=$(octalfont release current)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Run: Create tag"
        env:
          TAG: ${{ steps.info.outputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping."
            exit 0
          fi

          git tag --annotate "$TAG" --message "$TITLE $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: "Run: Create draft release"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.info.outputs.version }}
          TAG: ${{ steps.info.outputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          if gh release list --limit 200 --json tagName | jq -e --arg tag "$TAG" 'any(.[]; .tagName == $tag)' >/dev/null; then
            echo "Release $TAG already exists - skipping."
            exit 0
          fi

          PREVIOUS=$(octalfont release previous "$VERSION")
          ARGS=(-f "tag_name=$TAG")
          if [ -n "$PREVIOUS" ]; then
            ARGS+=(-f "previous_tag_name=$PREVIOUS")
          fi

          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq '.body' > /tmp/generated.md; then
            echo "_Merged pull requests could not be listed._" > /tmp/generated.md
          fi

          {
            octalfont release notes "$VERSION"
            echo
            echo "<details>"
            echo "<summary>Merged pull requests</summary>"
            echo
            cat /tmp/generated.md
            echo
            echo "</details>"
          } > /tmp/release-notes.md

          gh release create "$TAG" --draft --verify-tag \
            --title "$TITLE $TAG" \
            --notes-file /tmp/release-notes.md

  sync-dev:
    name: "Sync Dev"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    env:
      BASE: ${{ inputs.base-branch }}
      RELEASE: ${{ inputs.release-branch }}

    steps:
      - name: "Setup: GitHub App token"
        id: "app"
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID || vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: "Setup: Git identity"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: "Run: Merge release into dev"
        run: |
          git fetch origin "$BASE" "$RELEASE"
          git checkout -B "$BASE" "origin/$BASE"

          if ! git merge "origin/$RELEASE" --message "chore: sync $RELEASE into $BASE [ci-skip]"; then
            echo "::error::Merging $RELEASE into $BASE produced conflicts - resolve them manually with a regular PR."
            exit 1
          fi

          git push origin "$BASE"
